<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <title>Maktab O‘quvchilari uchun Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #0a3d62;
        }
        .question {
            background-color: white;
            margin: 20px auto;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .question h3 {
            margin-top: 0;
        }
        label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        button {
            display: block;
            background-color: #0a3d62;
            color: white;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            margin: 30px auto;
        }
        button:hover {
            background-color: #09527a;
        }
        #result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #227093;
        }
    </style>
</head>
<body>

    <h1>Maktab O‘quvchilari uchun Test</h1>

    <form id="quizForm">

        <div class="question">
            <h3>1. 25 + 17 = ?</h3>
            <label><input type="radio" name="q1" value="A" /> A) 40</label>
            <label><input type="radio" name="q1" value="B" /> B) 42</label>
            <label><input type="radio" name="q1" value="C" /> C) 43</label>
            <label><input type="radio" name="q1" value="D" /> D) 45</label>
        </div>

        <div class="question">
            <h3>2. Qaysi so‘z ot?</h3>
            <label><input type="radio" name="q2" value="A" /> A) yugurmoq</label>
            <label><input type="radio" name="q2" value="B" /> B) kitob</label>
            <label><input type="radio" name="q2" value="C" /> C) tez</label>
            <label><input type="radio" name="q2" value="D" /> D) chiroyli</label>
        </div>

        <div class="question">
            <h3>3. I ___ a student.</h3>
            <label><input type="radio" name="q3" value="A" /> A) is</label>
            <label><input type="radio" name="q3" value="B" /> B) am</label>
            <label><input type="radio" name="q3" value="C" /> C) are</label>
            <label><input type="radio" name="q3" value="D" /> D) be</label>
        </div>

        <button type="button" onclick="checkAnswers()">Natijani Tekshirish</button>
    </form>

    <div id="result"></div>

<script>
    // To'g'ri javoblar
    const answers = {
        q1: 'B', // 25 + 17 = 42
        q2: 'B', // kitob - ot
        q3: 'B'  // I am a student
    };

    function checkAnswers() {
        const form = document.getElementById('quizForm');
        let score = 0;
        let total = Object.keys(answers).length;

        // Har bir savol uchun foydalanuvchi javobini tekshiramiz
        for (let q in answers) {
            let userAnswer = form.elements[q].value;
            if (userAnswer === answers[q]) {
                score++;
            }
        }

        // Natijani chiqaramiz
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = `Siz ${score} ta to'g'ri javob berdingiz (${total} ta savoldan).`;
    }
</script>

</body>
</html>
